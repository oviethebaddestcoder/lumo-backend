name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  packages: write

jobs:
  # Find which modules changed. A change to lumo-kit or lumo-contracts tests everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        run: |
          ALL='lumo-contracts lumo-kit svc-feed svc-gateway svc-identity svc-live svc-media svc-messaging svc-moderation svc-notifier svc-realtime svc-social svc-wallet worker-transcoder'
          SVCS='svc-feed svc-gateway svc-identity svc-live svc-media svc-messaging svc-moderation svc-notifier svc-realtime svc-social svc-wallet worker-transcoder'
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then CHANGED="$ALL"; else
            CHANGED=$(git diff --name-only "$BASE" HEAD | cut -d/ -f1 | sort -u | tr '\n' ' ')
            if echo " $CHANGED " | grep -qE ' (lumo-kit|lumo-contracts|\.github) '; then CHANGED="$ALL"; fi
          fi
          pick() { out=(); for m in $1; do case " $CHANGED " in *" $m "*) out+=("\"$m\"");; esac; done; (IFS=,; echo "[${out[*]}]"); }
          echo "modules=$(pick "$ALL")" >> "$GITHUB_OUTPUT"
          echo "services=$(pick "$SVCS")" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      LUMO_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      LUMO_TEST_REDIS: redis://localhost:6379/9
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - run: go mod tidy   # writes go.sum until you commit one (see README)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Known-vulnerable dependencies or standard library calls fail the build.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Every service running together against real Postgres and Redis plus
  # in-memory Kafka/S3/Paystack, driven through the gateway like the apps
  # do (lumo-infra/e2e). Catches what per-service tests can't: one service's
  # events not doing what another service expects.
  e2e:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432
      E2E_REDIS_URL: redis://localhost:6379/5
      GOFLAGS: -mod=mod
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: false }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client redis-tools
      - run: lumo-infra/e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: e2e-logs, path: /tmp/lumo-e2e/logs }

  # Visual preview / UI smoke test: every backend service plus the web app
  # and the mobile app (rendered with react-native-web), demo data, and a
  # screenshot of every screen. Fails on any page error or CSP violation;
  # screenshots are attached to the run. Needs read access to lumo-web and
  # lumo-mobile: if they're private, add a fine-grained token with
  # "Contents: read" on both as the LUMO_REPOS_TOKEN secret.
  preview:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432
      E2E_REDIS_URL: redis://localhost:6379/5
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
        with: { path: lumo-backend }
      - uses: actions/checkout@v4
        with: { repository: oviethebaddestcoder/lumo-web, path: lumo-web, token: "${{ secrets.LUMO_REPOS_TOKEN || github.token }}" }
      - uses: actions/checkout@v4
        with: { repository: oviethebaddestcoder/lumo-mobile, path: lumo-mobile, token: "${{ secrets.LUMO_REPOS_TOKEN || github.token }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client redis-tools
      - working-directory: lumo-backend/lumo-infra/preview
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: lumo-backend/lumo-infra/preview/run.sh
        env: { WEB_DIR: lumo-web, MOBILE_DIR: lumo-mobile, OUT: "${{ github.workspace }}/preview-shots" }
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: preview-screenshots, path: preview-shots }

  # Recommender quality: simulated viewers through the real feed code.
  # Fails if personalization stops clearly beating random and
  # popularity-only ranking, starves new creators, or the interest picker
  # stops fixing cold start (svc-feed/internal/app/sim_test.go).
  recommender:
    needs: changes
    if: contains(needs.changes.outputs.modules, 'svc-feed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: svc-feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: svc-feed/go.mod }
      - run: go mod tidy
      - run: go test ./internal/app -run Sim -v -count=1 -timeout 15m
        env: { LUMO_SIM: "1", LUMO_TEST_REDIS: "redis://localhost:6379/9" }

  # Alert rules and dashboards: every PromQL expression must parse, every
  # alert needs a severity and a runbook section, and the dashboard file
  # must match its generator.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: false }
      - run: python3 lumo-infra/scripts/gen-dashboards.py && git diff --exit-code lumo-infra/k8s/dashboards.yaml
      - working-directory: lumo-infra/scripts/promcheck
        run: go mod tidy && go run . ../../k8s/alerts.yaml ../../k8s/dashboards.yaml

  # Secrets committed by mistake (keys, tokens) fail the build.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  image:
    needs: [changes, test, e2e, secrets]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          tags: ghcr.io/oviethebaddestcoder/${{ matrix.service }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
# Deploy: bump the image tag in your GitOps repo (Argo CD / Flux). See lumo-infra/README.md.
