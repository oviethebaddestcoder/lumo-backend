name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  packages: write

jobs:
  # Find which modules changed. A change to lumo-kit or lumo-contracts tests everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        run: |
          ALL='lumo-contracts lumo-kit svc-feed svc-gateway svc-identity svc-live svc-media svc-moderation svc-notifier svc-realtime svc-social svc-wallet worker-transcoder'
          SVCS='svc-feed svc-gateway svc-identity svc-live svc-media svc-moderation svc-notifier svc-realtime svc-social svc-wallet worker-transcoder'
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then CHANGED="$ALL"; else
            CHANGED=$(git diff --name-only "$BASE" HEAD | cut -d/ -f1 | sort -u | tr '\n' ' ')
            if echo " $CHANGED " | grep -qE ' (lumo-kit|lumo-contracts|\.github) '; then CHANGED="$ALL"; fi
          fi
          pick() { out=(); for m in $1; do case " $CHANGED " in *" $m "*) out+=("\"$m\"");; esac; done; (IFS=,; echo "[${out[*]}]"); }
          echo "modules=$(pick "$ALL")" >> "$GITHUB_OUTPUT"
          echo "services=$(pick "$SVCS")" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      LUMO_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      LUMO_TEST_REDIS: redis://localhost:6379/9
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - run: go mod tidy   # writes go.sum until you commit one (see README)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  image:
    needs: [changes, test]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          tags: ghcr.io/oviethebaddestcoder/${{ matrix.service }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
# Deploy: bump the image tag in your GitOps repo (Argo CD / Flux). See lumo-infra/README.md.
