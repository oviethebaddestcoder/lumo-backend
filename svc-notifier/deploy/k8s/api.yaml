apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-notifier-api
  labels: { app: svc-notifier, role: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 } }
  selector: { matchLabels: { app: svc-notifier, role: api } }
  template:
    metadata:
      labels: { app: svc-notifier, role: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080" }
    spec:
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: svc-notifier, role: api } } }
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: ghcr.io/oviethebaddestcoder/svc-notifier:latest
          args: ["serve"]
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: lumo-common }
            - secretRef: { name: lumo-common }
            - secretRef: { name: svc-notifier }
          resources:
            requests: { cpu: "500m", memory: "256Mi" }
            limits: { cpu: "2", memory: "1Gi" }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 5, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10, failureThreshold: 3 }
