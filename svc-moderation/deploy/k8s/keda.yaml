# Scale workers on Kafka consumer lag (requires KEDA). Workers never
# exceed the partition count of their main topic (12 by default).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: svc-moderation-worker }
spec:
  scaleTargetRef: { name: svc-moderation-worker }
  minReplicaCount: 1
  maxReplicaCount: 12
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-bootstrap:9092
        consumerGroup: moderation-chat
        topic: chat.messages
        lagThreshold: "500"
