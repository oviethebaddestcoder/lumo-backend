# Scale workers on Kafka consumer lag (requires KEDA). Workers never
# exceed the partition count of their main topic (12 by default).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: svc-live-worker }
spec:
  scaleTargetRef: { name: svc-live-worker }
  minReplicaCount: 1
  maxReplicaCount: 12
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-bootstrap:9092
        consumerGroup: live-gifts
        topic: wallet.gifts
        lagThreshold: "500"
