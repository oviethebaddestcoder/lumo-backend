# Consumer-lag metrics for alerts (ConsumerLagGrowing) and the dashboard:
# exposes kafka_consumergroup_lag{consumergroup,topic,partition}.
# Credentials come from the same secret the services use.
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka-exporter, namespace: lumo, labels: { app: kafka-exporter } }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-exporter } }
  template:
    metadata: { labels: { app: kafka-exporter } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args:
            - --kafka.server=$(KAFKA_BROKERS)
            - --sasl.enabled
            - --sasl.mechanism=scram-sha512
            - --sasl.username=$(KAFKA_USERNAME)
            - --sasl.password=$(KAFKA_PASSWORD)
            - --tls.enabled
            - --group.filter=^(feed|wallet|social|media|notifier|messaging|moderation|live|realtime|identity)-.*
          envFrom: [{ secretRef: { name: lumo-common } }]
          ports: [{ name: metrics, containerPort: 9308 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          readinessProbe: { httpGet: { path: /healthz, port: metrics } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka-exporter, namespace: lumo, labels: { app: kafka-exporter } }
spec:
  selector: { app: kafka-exporter }
  ports: [{ name: metrics, port: 9308, targetPort: metrics }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: kafka-exporter, namespace: lumo }
spec:
  selector: { matchLabels: { app: kafka-exporter } }
  endpoints: [{ port: metrics, interval: 30s }]
