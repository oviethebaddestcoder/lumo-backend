# Public entry: api.<domain> -> svc-gateway (HTTP + WebSockets).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumo-api
  namespace: lumo
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # WebSockets
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"        # uploads go straight to S3
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls: [{ hosts: [api.lumo.app], secretName: api-tls }]
  rules:
    - host: api.lumo.app
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: svc-gateway, port: { number: 80 } } } }
