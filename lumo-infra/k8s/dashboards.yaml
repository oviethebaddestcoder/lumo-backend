# Grafana dashboard, loaded by the Grafana sidecar (label grafana_dashboard=1).
# Generated: edit the panel list in lumo-infra/scripts/gen-dashboards.py and re-run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumo-dashboards
  namespace: monitoring
  labels: { grafana_dashboard: "1" }
data:
  lumo-overview.json: |
    {
      "title": "Lumo overview",
      "uid": "lumo-overview",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "lumo"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Availability",
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Requests / s by service",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total[5m]))",
              "refId": "A",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "5xx rate by route",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum by (service, route) (rate(http_requests_total{status=~\"5..\"}[5m])) / sum by (service, route) (rate(http_requests_total[5m]))",
              "refId": "A",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
