# Scale workers on Kafka consumer lag (requires KEDA). Workers never
# exceed the partition count of their main topic (12 by default).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: worker-transcoder-worker }
spec:
  scaleTargetRef: { name: worker-transcoder-worker }
  minReplicaCount: 2
  maxReplicaCount: 12
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-bootstrap:9092
        consumerGroup: transcoder
        topic: media.jobs
        lagThreshold: "5"
