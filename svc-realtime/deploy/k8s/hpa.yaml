apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: svc-realtime-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: svc-realtime-api }
  minReplicas: 3
  maxReplicas: 200
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
